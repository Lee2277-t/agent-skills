name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 改成你的打包命令（electron-builder / tauri build / pyinstaller）
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          # 资产名必须带版本和平台，别用 setup.exe
          files: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
          draft: false
          prerelease: false
          body: |
            ## 变更
            -
            ## 校验
            sha256 见下方资产列表。
